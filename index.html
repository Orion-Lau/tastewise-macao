<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#20342f" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151f1a" />
    <script>
      // 首帧前写入主题，避免闪烁：localStorage 记忆优先，其次跟随系统偏好
      (function () {
        try {
          var stored = window.localStorage.getItem("aoweizhiyi_theme");
          var theme = stored === "dark" || stored === "light"
            ? stored
            : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta name="description" content="澳味智译 — 澳門在地小店的多語菜單與智慧接待。" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b83d2d'/%3E%3Ctext x='32' y='45' font-family='Georgia,serif' font-size='36' fill='%23fff8eb' text-anchor='middle'%3E%E5%91%B3%3C/text%3E%3C/svg%3E" />
    <title>澳味智译 · TasteWise Macao</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
